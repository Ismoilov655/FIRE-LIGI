<script>
(function(){
  var t=null;
  try{
    var s=JSON.parse(localStorage.getItem("kanji_flashcards_state_v5")||"null")||JSON.parse(localStorage.getItem("kanji_flashcards_state_v4")||"null");
    if(s&&(s.theme==="dark"||s.theme==="light"))t=s.theme;
  }catch(e){}
  if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";
  document.documentElement.setAttribute("data-theme",t);
})();

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  /* Kyoto morning: pale sakura-lilac washi, aizome indigo ink */
  --bg:#F3EBF3;
  --bg-2:#FBE7EF;
  --ink:#1F1B4D;
  --ink-2:#5B5683;
  --ink-3:#8A86AC;
  --glass:rgba(255,255,255,.78);
  --glass-2:rgba(255,255,255,.82);
  --face:#FDF6F9;
  --stroke:rgba(255,255,255,.9);
  --line:rgba(31,27,77,.12);
  --accent:#D6246E;
  --accent-2:#3552E6;
  --accent-soft:rgba(214,36,110,.10);
  --accent-ink:#FFFFFF;
  --seal:#E2452B;
  --good:#18946A;
  --good-soft:rgba(24,148,106,.12);
  --bad:#D63A55;
  --bad-soft:rgba(214,58,85,.12);
  --hard:#C8641E;
  --glow:0 0 0 rgba(0,0,0,0);
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 12px 34px rgba(60,40,120,.12);
  --shadow-lg:0 1px 0 rgba(255,255,255,.8) inset,0 24px 60px rgba(60,40,120,.20);
  --font-ui:'Exo 2','Segoe UI',system-ui,sans-serif;
  --font-jp:'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;
  --r-lg:22px;--r-md:14px;--r-sm:9px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  /* Tokyo night: plum black, neon sakura, cyan only for info */
  --bg:#0A0613;
  --bg-2:#170B2E;
  --ink:#F4EDFB;
  --ink-2:#B3A7D0;
  --ink-3:#7F739F;
  --glass:rgba(30,18,58,.78);
  --glass-2:rgba(38,24,72,.78);
  --face:#1F1440;
  --stroke:rgba(255,110,190,.22);
  --line:rgba(255,255,255,.10);
  --accent:#FF4FA3;
  --accent-2:#46E0FF;
  --accent-soft:rgba(255,79,163,.14);
  --accent-ink:#20061A;
  --seal:#FF5A3C;
  --good:#4BE3A0;
  --good-soft:rgba(75,227,160,.13);
  --bad:#FF6B87;
  --bad-soft:rgba(255,107,135,.14);
  --hard:#FFA45C;
  --glow:0 0 18px rgba(255,79,163,.45);
  --shadow:0 0 0 1px rgba(255,110,190,.08) inset,0 14px 40px rgba(0,0,0,.45);
  --shadow-lg:0 0 0 1px rgba(255,110,190,.14) inset,0 26px 70px rgba(0,0,0,.6),0 0 40px rgba(255,79,163,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;min-height:100vh;font-family:var(--font-ui);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);transition:background .4s,color .4s;}
[hidden]{display:none !important;}
button,select,input{font-family:inherit;touch-action:manipulation;}
button{-webkit-appearance:none;appearance:none;}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}

/* ---- background layers: all behind content and never take clicks ---- */
#sakura{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;}
.bg-deco{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(900px 560px at 8% -6%,var(--accent-soft),transparent 65%),
    radial-gradient(800px 520px at 100% 8%,color-mix(in srgb,var(--accent-2) 14%,transparent),transparent 62%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);}
:root[data-theme="dark"] .bg-deco::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46vh;opacity:.5;
  background:
    linear-gradient(transparent 0,var(--bg) 100%),
    repeating-linear-gradient(90deg,rgba(255,79,163,.16) 0 1px,transparent 1px 64px),
    repeating-linear-gradient(0deg,rgba(70,224,255,.10) 0 1px,transparent 1px 48px);
  mask-image:linear-gradient(transparent,#000 70%);-webkit-mask-image:linear-gradient(transparent,#000 70%);}

.app{position:relative;max-width:780px;margin:0 auto;padding:16px 16px 70px;
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));
  padding-bottom:max(70px,calc(env(safe-area-inset-bottom) + 40px));}

/* ---- glass ---- */
.glass{background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--shadow);
}

/* ---- header ---- */
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto;min-width:0;}
.brand b{font-family:var(--font-jp);font-weight:700;font-size:25px;letter-spacing:.02em;color:var(--ink);}
.brand b i{font-style:normal;color:var(--accent);text-shadow:var(--glow);}
.brand span{font-size:12px;color:var(--ink-2);margin-top:3px;}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.chip-btn{display:flex;align-items:center;gap:7px;height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--stroke);background:var(--glass);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;
box-shadow:var(--shadow);transition:border-color .2s,transform .15s;}
.chip-btn:hover{border-color:var(--accent);}
.chip-btn:active{transform:scale(.97);}
.chip-btn b{font-variant-numeric:tabular-nums;}
.streak.hot{border-color:var(--accent);box-shadow:var(--shadow),var(--glow);}
select{height:40px;padding:0 30px 0 12px;font-size:16px;font-weight:600;color:var(--ink);border-radius:12px;border:1px solid var(--stroke);background:var(--glass-2);cursor:pointer;box-shadow:var(--shadow);}
select option{background:var(--bg-2);color:var(--ink);}
.field{height:44px;width:100%;padding:0 14px;font-size:16px;color:var(--ink);background:var(--glass-2);border:1px solid var(--line);border-radius:12px;outline:none;}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.field::placeholder{color:var(--ink-3);}

/* the one memorable thing: rank seal (hanko) with a neon progress ring */
.seal-btn{position:relative;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px 0 4px;border-radius:999px;border:1px solid var(--stroke);background:var(--glass);color:var(--ink);cursor:pointer;box-shadow:var(--shadow);
}
.seal{position:relative;width:40px;height:40px;flex:none;}
.seal svg{position:absolute;inset:0;transform:rotate(-90deg);}
.seal .ring-bg{stroke:var(--line);}
.seal .ring{stroke:var(--accent);filter:drop-shadow(0 0 4px var(--accent));transition:stroke-dashoffset .8s cubic-bezier(.3,.7,.2,1);}
.seal .stamp{position:absolute;inset:5px;border-radius:50%;background:var(--seal);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-jp);font-weight:700;font-size:13px;line-height:1;text-align:center;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);transform:rotate(-7deg);}
.seal .stamp.long{font-size:11px;letter-spacing:-.04em;}
.seal-meta{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;text-align:left;}
.seal-meta b{font-size:13.5px;max-width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.seal-meta span{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;}
.fpts{position:absolute;right:10px;top:-6px;font-weight:700;font-size:16px;pointer-events:none;animation:fpts 1.1s ease-out forwards;}
.fpts.up{color:var(--good);}.fpts.down{color:var(--bad);}
@keyframes fpts{0%{opacity:0;transform:translateY(8px) scale(.8);}20%{opacity:1;transform:translateY(-4px) scale(1.1);}100%{opacity:0;transform:translateY(-26px);}}

/* ---- page switch ---- */
nav.pages{position:sticky;top:8px;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;margin-bottom:16px;border-radius:20px;}
.pg-btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:9px 6px;border:0;border-radius:15px;background:transparent;color:var(--ink-2);font-size:14.5px;font-weight:700;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s;}
.pg-btn i{font-style:normal;font-family:var(--font-jp);font-size:22px;line-height:1;}
.pg-btn:hover{color:var(--ink);}
.pg-btn.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent),var(--glow);}
:root[data-theme="dark"] .pg-btn.on{color:#2A0820;}

/* ---- panels, chips, segmented ---- */
.panel{border-radius:var(--r-lg);padding:15px 16px;margin-bottom:14px;}
.sub{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;padding:4px;border-radius:16px;scrollbar-width:none;}
.sub::-webkit-scrollbar{display:none;}
.sub button{flex:1 0 auto;min-width:max-content;border:0;background:transparent;border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:background .2s,color .2s;}
.sub button:hover{color:var(--ink);}
.sub button.on{background:var(--glass-2);color:var(--accent);box-shadow:0 1px 0 var(--line) inset,0 4px 14px rgba(0,0,0,.10);}
.lbl{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:8px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;}
.chip:hover{border-color:var(--accent);color:var(--ink);}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .12s,filter .2s;}
:root[data-theme="dark"] .btn{color:#2A0820;}
.btn:hover{filter:brightness(1.07);}
.btn:active{transform:scale(.97);}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line);box-shadow:none;}
:root[data-theme="dark"] .btn.ghost{color:var(--ink-2);}
.btn.ghost:hover{color:var(--ink);border-color:var(--accent);}
.btn.sm{padding:9px 13px;font-size:13px;}
.btn.block{width:100%;}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.range input[type=number]{width:74px;height:42px;text-align:center;font-size:16px;font-weight:600;color:var(--ink);background:var(--glass-2);border:1px solid var(--line);border-radius:11px;}
.info{font-size:13px;color:var(--ink-2);margin-top:10px;}
.info b{color:var(--ink);}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.5;}

/* ---- stats ---- */
.stats{display:flex;gap:9px;margin-bottom:10px;}
.stat{flex:1;min-width:0;border-radius:var(--r-md);padding:9px 14px;}
.stat b{display:block;font-family:var(--font-jp);font-size:22px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;}
.stat span{font-size:12px;color:var(--ink-2);}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:16px;}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s cubic-bezier(.3,.7,.2,1);box-shadow:var(--glow);}

/* ---- flashcard (3D) ---- */
.cardarea{perspective:1600px;margin-bottom:14px;}
.flashcard{position:relative;min-height:360px;border-radius:var(--r-lg);cursor:pointer;will-change:transform;}
.flashcard.flipped .face.front{display:none;}.flashcard:not(.flipped) .face.back{display:none;}
.face{position:absolute;inset:0;border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:26px 22px;text-align:center;overflow:hidden;
  
  background:var(--face);border:1px solid var(--stroke);box-shadow:var(--shadow-lg);
}

.face::before{content:"";position:absolute;inset:9px;border-radius:calc(var(--r-lg) - 8px);border:1px solid var(--line);pointer-events:none;}
.face::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 66%);pointer-events:none;}
.face>*{position:relative;z-index:1;}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:7px;border:1px solid var(--line);color:var(--ink-2);}
.tag.pk{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}
.tag.lv{background:var(--seal);border-color:var(--seal);color:#fff;}
.big-k{font-family:var(--font-jp);font-weight:700;font-size:112px;line-height:1.05;color:var(--ink);}
.big-w{font-family:var(--font-jp);font-weight:700;font-size:52px;line-height:1.25;color:var(--ink);overflow-wrap:anywhere;}
.big-w.m{font-size:38px;}.big-w.s{font-size:28px;}.big-w.xs{font-size:21px;line-height:1.4;}
.under{font-family:var(--font-jp);font-size:19px;color:var(--ink-2);margin-top:2px;}
.under.sm{font-size:17px;}
.tap{margin-top:16px;font-size:12.5px;color:var(--ink-3);}
.readings{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center;font-size:15px;font-weight:600;margin-bottom:10px;}
.on-r{color:var(--accent);}.kun-r{color:var(--accent-2);}
.mean{font-size:25px;font-weight:700;line-height:1.25;color:var(--ink);}
.rom{font-size:16px;color:var(--ink-2);margin-bottom:8px;}
.rom small{display:block;font-size:13px;color:var(--ink-3);}
.parent{margin-top:14px;font-size:13px;color:var(--ink-2);background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:7px 13px;}
.parent b{font-family:var(--font-jp);font-size:17px;margin-right:6px;color:var(--ink);}
.strokes{margin-top:8px;font-size:12.5px;color:var(--ink-3);}
.spk{position:absolute !important;top:14px;right:14px;z-index:3 !important;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:transform .15s,border-color .2s;}
.spk:hover{border-color:var(--accent);transform:scale(1.08);}
.spk.inl{position:static !important;width:34px;height:34px;font-size:14px;flex:none;}

/* Hard / Good / Easy */
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.grade{display:flex;flex-direction:column;align-items:center;gap:1px;padding:11px 6px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;font-size:15px;font-weight:700;transition:transform .12s,opacity .2s,border-color .2s,box-shadow .2s;}
.grade small{font-size:11.5px;font-weight:500;color:var(--ink-2);}
.grade:active:not(:disabled){transform:scale(.97);}
.grade:disabled{opacity:.38;cursor:default;}
.grade.hard{border-color:color-mix(in srgb,var(--hard) 55%,transparent);}
.grade.hard:not(:disabled):hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--hard) 40%,transparent);}
.grade.hard b{color:var(--hard);}
.grade.good{border-color:color-mix(in srgb,var(--good) 55%,transparent);}
.grade.good:not(:disabled):hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--good) 40%,transparent);}
.grade.good b{color:var(--good);}
.grade.easy{border-color:color-mix(in srgb,var(--accent-2) 55%,transparent);}
.grade.easy:not(:disabled):hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent-2) 40%,transparent);}
.grade.easy b{color:var(--accent-2);}
.ctl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px;}
.hint{text-align:center;font-size:12.5px;color:var(--ink-3);margin-top:12px;}
.done{text-align:center;border-radius:var(--r-lg);padding:38px 22px;}
.done .em{font-size:44px;margin-bottom:6px;}
.done h2{font-family:var(--font-jp);font-size:26px;margin:0 0 8px;}
.done p{color:var(--ink-2);margin:0 0 18px;}

/* ---- kana chart ---- */
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none;}
.kprev{min-height:96px;display:flex;align-items:center;gap:16px;border-radius:var(--r-lg);padding:14px 18px;margin-bottom:14px;}
.kprev .pc{font-family:var(--font-jp);font-weight:700;font-size:58px;line-height:1;color:var(--ink);min-width:70px;text-align:center;}
.kprev .pc small{display:block;font-size:26px;color:var(--ink-2);margin-top:2px;}
.kprev .pr{flex:1;font-size:15px;}
.kprev .pr b{font-size:24px;display:block;line-height:1.2;}
.kprev .pr span{color:var(--ink-2);font-size:13px;}
.kgroup{margin-bottom:18px;}
.kgroup h3{font-family:var(--font-jp);font-size:17px;font-weight:700;margin:0 0 3px;}
.kgroup .note{margin-bottom:9px;}
.kgrid{display:grid;gap:7px;}
.kgrid.c5{grid-template-columns:repeat(5,1fr);}
.kgrid.c3{grid-template-columns:repeat(3,1fr);}
.kcell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 2px 7px;border-radius:13px;border:1px solid var(--stroke);background:var(--glass);color:var(--ink);cursor:pointer;min-height:68px;
transition:transform .12s,border-color .2s,box-shadow .2s,background .2s;}
.kcell:hover{border-color:var(--accent);}
.kcell:active{transform:scale(.94);}
.kcell.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--glow);}
.kcell .kc{font-family:var(--font-jp);font-weight:700;font-size:28px;line-height:1.1;}
.kcell .kl{font-size:12px;color:var(--ink-2);margin-top:2px;}
.kcell.empty{visibility:hidden;}
.kgrid.c3 .kcell .kc{font-size:25px;}

/* ---- search ---- */
.search{position:relative;margin-bottom:12px;}
.search .field{padding-left:42px;padding-right:42px;}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;font-size:15px;}
.search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--ink-3);font-size:16px;cursor:pointer;}
.results{border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;}
.res-head{padding:11px 16px;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line);}
.res{display:flex;align-items:center;gap:13px;width:100%;padding:11px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;cursor:pointer;transition:background .15s;}
.res:last-child{border-bottom:0;}
.res:hover{background:var(--accent-soft);}
.res .rw{font-family:var(--font-jp);font-weight:700;font-size:24px;min-width:62px;max-width:40%;overflow-wrap:anywhere;line-height:1.2;}
.res .rw small{display:block;font-size:13px;font-weight:500;color:var(--ink-2);}

/* ---- vocab list ---- */

.vlist{border-radius:var(--r-lg);overflow:hidden;}

/* ---- kanji browse card ---- */
.kc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:10px;}

.kc-nav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;margin-bottom:12px;}
.kcard{position:relative;border-radius:var(--r-lg);padding:22px 20px;margin-bottom:12px;cursor:pointer;background:var(--glass-2);border:1px solid var(--stroke);box-shadow:var(--shadow-lg);-webkit-user-select:none;user-select:none;}
.kc-head{display:flex;align-items:center;gap:20px;}

/* ---- quiz ---- */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:8px;}
.qtop b{color:var(--ink);}
.qcard{position:relative;border-radius:var(--r-lg);padding:24px 18px;text-align:center;margin-bottom:12px;background:var(--glass-2);border:1px solid var(--stroke);box-shadow:var(--shadow-lg);}
.qprompt{margin-top:12px;font-size:13px;color:var(--ink-2);}
.qtr{font-size:29px;font-weight:700;line-height:1.25;padding:6px 0;}
.qrd{font-size:34px;font-weight:700;line-height:1.3;padding:6px 0;}
.opts{display:grid;gap:9px;margin-bottom:12px;}
.opts.grid{grid-template-columns:1fr 1fr;}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:14px;font-size:15.5px;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;}
.opt:hover:not(:disabled){border-color:var(--accent);}
.opt:active:not(:disabled){transform:scale(.98);}
.opt .n{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--ink-2);}
.opt.jp{justify-content:center;font-family:var(--font-jp);font-size:30px;padding:14px 8px;position:relative;flex-direction:column;gap:0;line-height:1.2;}
.opt.jp small{font-size:14px;font-weight:500;color:var(--ink-2);}
.opt.jp .n{position:absolute;top:7px;left:7px;width:20px;height:20px;font-size:10px;}
.opt.kana{font-size:18px;}
.opt:disabled{cursor:default;}
.opt.dim{opacity:.5;}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--good);}
.opt.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);animation:shake .35s;}
.opt.ok .n,.opt.no .n{border-color:currentColor;color:inherit;}
.opt.ok small,.opt.no small{color:inherit;}
@keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.fb{border-radius:var(--r-md);padding:14px 16px;margin-bottom:12px;font-size:14px;line-height:1.5;text-align:left;animation:pop .22s ease;}
@keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.fb.ok{background:var(--good-soft);border:1px solid var(--good);}
.fb.no{background:var(--bad-soft);border:1px solid var(--bad);}
.fb .ft{font-weight:700;margin-bottom:5px;display:flex;justify-content:space-between;}
.fb.ok .ft{color:var(--good);}.fb.no .ft{color:var(--bad);}
.fb-main{font-size:17px;font-weight:700;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 9px;}
.fb-main .jp{font-family:var(--font-jp);font-size:26px;}
.fb-sub{font-size:13px;color:var(--ink-2);margin-top:5px;}
.fb-x{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-2);}
.fb-x b{color:var(--ink);}
.score-big{font-family:var(--font-jp);font-size:54px;font-weight:700;margin:4px 0;color:var(--accent);text-shadow:var(--glow);}
.col{display:flex;flex-direction:column;gap:9px;margin-top:16px;}
.lvbox{display:grid;gap:8px;}
.lvrow{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:11px 13px;border-radius:var(--r-md);border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:all .18s;}
.lvrow:hover{border-color:var(--accent);}
.lvrow.on{border-color:var(--accent);background:var(--accent-soft);}
.lvrow .ln{flex:none;width:30px;height:30px;border-radius:9px;background:var(--glass-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);}
.lvrow.on .ln{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.lvrow b{display:block;font-size:14px;}
.lvrow span{font-size:12.5px;color:var(--ink-2);}
.suggest{margin-top:10px;padding:10px 12px;border-radius:var(--r-md);background:var(--good-soft);border:1px solid var(--good);font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;}

/* ---- modal / toast ---- */
.veil{will-change:opacity;position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(10,6,19,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:440px;max-height:88vh;overflow:auto;border-radius:24px;padding:22px 20px;background:var(--glass-2);border:1px solid var(--stroke);box-shadow:var(--shadow-lg),var(--glow);animation:pop .25s ease;}

.det-k{font-family:var(--font-jp);font-weight:700;font-size:84px;line-height:1.05;text-align:center;}
.det-w{font-family:var(--font-jp);font-weight:700;font-size:44px;line-height:1.2;text-align:center;overflow-wrap:anywhere;}

.det-tr{font-size:22px;font-weight:700;text-align:center;margin:10px 0 2px;}
.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:120;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;max-width:88vw;background:var(--glass-2);border:1px solid var(--stroke);box-shadow:var(--shadow-lg);animation:pop .22s ease;}
.rank-up{text-align:center;}

.pf-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
.pf-row span{color:var(--ink-2);}
.rbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 4px;}
.rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;}

.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;}
.av{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font-family:var(--font-jp);font-weight:700;font-size:24px;cursor:pointer;transition:transform .12s,border-color .2s,background .2s;}

.lb-me i{font-style:normal;margin-right:6px;}.lb-me .jp{font-family:var(--font-jp);font-weight:700;color:var(--accent);}

.lb-row.p1{border-color:#FFC857;background:linear-gradient(90deg,rgba(255,200,87,.16),transparent 70%);}

.p1 .lb-pos{background:#FFC857;color:#3a2a00;border-color:#FFC857;}.p2 .lb-pos{background:#C9D1E3;color:#232a3b;border-color:#C9D1E3;}.p3 .lb-pos{background:#D98F5C;color:#3a1d08;border-color:#D98F5C;}

}

/* =====================================================================
   SRS (Hard / Good / Easy)
   ===================================================================== */
const SRS = {
  today: () => dayNum(),
  deck(d) { return S.srs[d] || (S.srs[d] = {}); },
  get(d, id) { return this.deck(d)[id]; },
  calc(s, g) {
    s = s || { i: 0, e: 2.5, r: 0 };
    let e = s.e, i = s.i, r = s.r;
    if (g === "hard") { e = Math.max(1.3, e - .2); return { i: 1, e, r, d: this.today() }; }
    r += 1;
    if (g === "good") i = r === 1 ? 1 : r === 2 ? 3 : Math.round(i * e);
    else { e = Math.min(3.2, e + .15); i = r === 1 ? 3 : r === 2 ? 6 : Math.round(Math.max(i, 1) * e * 1.4); }
    i = Math.max(1, i);
    return { i, e, r, d: this.today() + i };
  },
  label(n) { return n < 7 ? n + " " + t("dayU") : n < 30 ? Math.round(n / 7) + " " + t("weekU") : Math.round(n / 30) + " " + t("monthU"); },
  apply(d, id, g) { this.deck(d)[id] = this.calc(this.get(d, id), g); save(); },
  isNew(d, id) { return !this.get(d, id); },
  learned(d, id) { const s = this.get(d, id); return !!(s && s.r > 0); }
};
const shuffleGroups = q => {
  const gs = [], map = new Map();
  q.forEach(c => { const k = c.g == null ? "_" + c.id : c.g; if (!map.has(k)) { map.set(k, []); gs.push(map.get(k)); } map.get(k).push(c); });
  return shuffle(gs).reduce((a, g) => a.concat(g), []);
};

/* Multiple choice quiz with points */
class Quiz {
  constructor(host, o) { this.host = host; this.o = o; this.phase = "idle"; }
  start(items) {
    this.items = shuffle(items); this.i = 0; this.ok = 0; this.earned = 0; this.wrong = []; this.phase = "run";
    if (this.o.onRun) this.o.onRun(true);

  }
  prep() { this.q = this.o.makeQ(this.items[this.i]); this.q.opts = shuffle(this.q.opts); this.answered = false; this.chosen = null; this.gain = 0; }
  answer(id) {
    if (this.answered) return;
    this.chosen = id; this.answered = true;
    const ok = id === this.q.correct;
    if (ok) this.ok++; else this.wrong.push(this.items[this.i]);
    this.gain = this.o.noPts ? 0 : addPoints(ok ? this.q.pts : -1);
    this.earned += this.gain;
    if (ok && !this.o.noPts) { const it = this.items[this.i]; Act.card(it.s || this.o.src || "q", it.id); }
    if (this.o.src) { Mist.rec(this.o.src, this.items[this.i], ok); Act.ans(this.o.src, ok); }
    if (this.o.onAnswer) this.o.onAnswer(this.items[this.i], ok);
    this.render();
  }
  next() {
    if (!this.answered) return;
    this.i++;
    if (this.i >= this.items.length) { this.phase = "result"; if (this.o.onFinish) { this.o.onFinish(this); return; } if (this.ok / this.items.length >= .8) confetti(); }
    else this.prep();
    this.render();
    this.host.scrollIntoView && this.host.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  quit() { document.body.classList.remove("inquiz"); this.phase = "idle"; if (this.o.onRun) this.o.onRun(false); this.o.onSetup(); }
  render() {
    KB.quiz = this;
    document.body.classList.toggle("inquiz", this.phase === "run");
    if (this.phase === "result") {
      const n = this.items.length, pct = Math.round(this.ok / n * 100);
      this.host.innerHTML = `<div class="done glass"><div class="em">${pct >= 90 ? "🏆" : pct >= 70 ? "🎉" : pct >= 40 ? "👍" : "💪"}</div><h2>${esc(t("resultTitle"))}</h2><div class="score-big">${pct}%</div>
        <p style="margin:0">${t("resultText", this.ok, n)}</p><p style="margin:6px 0 0">${esc(t("earnedPts", this.earned))}</p>
        <div class="col">${this.wrong.length ? `<button class="btn ghost" data-a="retry" type="button">${esc(t("retryWrong", this.wrong.length))}</button>` : ""}<button class="btn" data-a="again" type="button">${esc(t("again2"))}</button><button class="btn ghost" data-a="setup" type="button">${esc(t("backSetup"))}</button></div></div>`;
      const w = this.wrong.slice(), all = this.items.slice();

      return `<button class="${c}" data-i="${i}" type="button" ${this.answered ? "disabled" : ""}><span class="n">${i + 1}</span><span>${o.label}</span></button>`;
    }).join("");

      fb = `<div class="fb ${ok ? "ok" : "no"}"><div class="ft"><span>${ok ? "✓ " + esc(t("right")) : "✗ " + esc(t("wrong"))}</span><span>${this.gain > 0 ? "+" + this.gain : this.gain < 0 ? this.gain : "0"}</span></div>${q.explain(ch, ok)}</div>`;
    }
    this.host.innerHTML = `<div class="qtop"><span><b>${this.i + 1}</b> / ${n}</span><span>✓ ${this.ok} · ✗ ${this.wrong.length}</span><button class="btn ghost sm" data-a="quit" type="button">✕ ${esc(t("quit"))}</button></div>
      <div class="bar" style="margin-bottom:12px"><i style="width:${pct}%"></i></div>
      <div class="qcard">${q.prompt}${q.say ? spk(q.say) : ""}</div>

      ${this.answered ? `<button class="btn block" data-a="next" type="button">${esc(this.i + 1 >= n ? t("finish") : t("next"))}</button>` : ""}`;
    $$(".opt", this.host).forEach(b => b.onclick = () => this.answer(q.opts[+b.dataset.i].id));
    const nx = $("[data-a=next]", this.host); if (nx) { nx.onclick = () => this.next(); nx.scrollIntoView && nx.scrollIntoView({ block: "nearest", behavior: "smooth" }); }

  }
}

    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => {
      p.y += p.vy * dt; p.x += p.vx * dt; p.a += p.va * dt; p.ph += dt * 1.1;
      if (p.y > H + 24 || p.x > W + 60 || p.x < -60) Object.assign(p, make(true));
      petal(p, dark);
    });
  }
  size(); addEventListener("resize", debounce(size, 200));
  if (reduce) return;
  document.addEventListener("visibilitychange", () => { if (document.hidden) cancelAnimationFrame(raf); else { last = performance.now(); raf = requestAnimationFrame(frame); } });
  raf = requestAnimationFrame(frame);
})();

/* =====================================================================
   ROMAJI -> CYRILLIC (Polivanov style)
   ===================================================================== */
const CYR_SP = { shi: "си", chi: "ти", tsu: "цу", fu: "фу", ji: "дзи", ja: "дзя", ju: "дзю", jo: "дзё", je: "дзе", cha: "тя", chu: "тю", cho: "тё", che: "тэ", sha: "ся", shu: "сю", sho: "сё", she: "сэ", wo: "о", wa: "ва", wi: "ви", we: "вэ", va: "ва", vi: "ви", vu: "ву", ve: "вэ", vo: "во", ti: "ти", di: "ди", tu: "ту", du: "ду", dyu: "дю", fa: "фа", fi: "фи", fe: "фэ", fo: "фо" };
const CYR_C = { k: "к", g: "г", s: "с", z: "дз", t: "т", d: "д", n: "н", h: "х", b: "б", p: "п", m: "м", r: "р", w: "в", f: "ф", j: "дз" };
const CYR_V = { a: "а", i: "и", u: "у", e: "э", o: "о" };
const CYR_Y = { a: "я", u: "ю", o: "ё" };
function cyrWord(s) {
  s = String(s).toLowerCase(); let out = "", i = 0, m;
  while (i < s.length) {
    const ch = s[i], rest = s.slice(i);
    if (!/[a-z]/.test(ch)) { if (ch !== "'") out += ch; i++; continue; }
    if (i + 1 < s.length && ch === s[i + 1] && !/[aiueon]/.test(ch)) { out += CYR_C[ch] || ch; i++; continue; }
    if ((m = rest.match(/^(shi|chi|tsu|sha|shu|sho|she|cha|chu|cho|che|dyu|ja|ju|jo|je|ji|fa|fi|fe|fo|fu|wo|wa|wi|we|va|vi|vu|ve|vo|ti|di|tu|du)/))) { out += CYR_SP[m[1]]; i += m[1].length; continue; }
    if ((m = rest.match(/^y([auo])/))) { out += CYR_Y[m[1]]; i += 2; continue; }
    if ((m = rest.match(/^([kgsztdnhbpmr])y([auo])/))) { out += CYR_C[m[1]] + CYR_Y[m[2]]; i += 3; continue; }
    if ((m = rest.match(/^([kgsztdnhbpmr])([aiueo])/))) { out += CYR_C[m[1]] + CYR_V[m[2]]; i += 2; continue; }
    if (CYR_V[ch]) { out += CYR_V[ch]; i++; continue; }
    if (ch === "n") { out += "н"; i++; continue; }
    out += ch; i++;
  }
  return out;
}

  };
}

KANA_ALL.forEach(e => { KR[e.h || kata2hira(e.k)] = e.r; });
function kanaToRomaji(s) {
  s = kata2hira(s); let out = "", i = 0, dbl = false;
  while (i < s.length) {
    const c1 = s[i], c2 = s.substr(i, 2);
    if (c1 === "っ") { dbl = true; i++; continue; }
    if (c1 === "ー") { const m = out.match(/[aiueo]$/); if (m) out += m[0]; i++; continue; }
    let r;
    if (c2.length === 2 && KR[c2]) { r = KR[c2]; i += 2; } else if (KR[c1]) { r = KR[c1]; i++; } else { out += c1; i++; dbl = false; continue; }
    if (dbl) { out += r.startsWith("ch") ? "t" : r[0]; dbl = false; }
    out += r;
  }
  return out;
}
const collapseLong = s => s.replace(/ou/g, "o").replace(/([aiueo])\1/g, "$1");

const SIM = ["さち", "きさ", "ぬめ", "ねれわ", "るろ", "はほけ", "まも", "いり", "こに", "あお", "ぬの", "ろる", "シツソン", "ンソ", "クタ", "ウワ", "コユ", "ヌス", "ノメ", "マム", "チテ", "フワ", "ケタ", "ミモ"];

/* cards the learner currently selected: script x groups */
function kanaCards() {
  const K = S.kana, out = [], kinds = K.script === "both" ? ["h", "k"] : [K.script === "kata" ? "k" : "h"];
  KGROUPS.forEach(g => {
    if (!K.groups.includes(g.id)) return;
    g.cells.forEach(e => {
      if (!e) return;
      kinds.forEach(kd => {
        const ch = kd === "h" ? e.h : e.k; if (!ch) return;
        out.push({ id: kd + ":" + g.id + ":" + ch, ch, kind: kd, r: e.r, c: e.c, alt: kd === "h" ? e.k : e.h, grp: g.id });
      });
    });
  });

}
function kanaPool(kind) {                                   // wide pool for distractors
  const out = [];

}

    const dir = R_.dir === "mix" ? (Math.random() < .5 ? "fwd" : "rev") : R_.dir;
    const pool = uniqBy(RD.filter(x => x.id !== c.id && Math.abs(x.lv - c.lv) <= 1 && tr(x) !== tr(c) && x.t !== c.t), x => (dir === "fwd" ? tr(x) : x.t));
    const d = shuffle(pool).slice(0, 3), all = [c, ...d];
    if (dir === "fwd") {
      return {
        pts: c.lv <= 2 ? 1 : 2, say: c.t, prompt: `<div class="big-w ${c.t.length > 10 ? "xs" : c.t.length > 7 ? "s" : "m"}">${esc(c.t)}</div><div class="qprompt">${esc(t("qMeaning"))}</div>`, correct: c.id,
        opts: all.map(x => ({ id: x.id, label: esc(tr(x)) })),
        explain: (ch, ok) => `<div class="fb-main">${esc(c.t)} — ${esc(tr(c))}</div><div class="fb-sub">${esc(c.r)} · ${esc(c.c)}</div>`
      };
    }
    return {
      pts: 2, prompt: `<div class="qtr">${esc(tr(c))}</div><div class="qprompt">${esc(t("qJapanese"))}</div>`, correct: c.id, optCls: "jp",
      opts: all.map(x => ({ id: x.id, label: esc(x.t) })),
      explain: (ch, ok) => `<div class="fb-main jp">${esc(c.t)}</div><div class="fb-sub">${esc(c.r)} · ${esc(c.c)}</div>${spk(c.t, true)}`
    };
  }
};

/* =====================================================================
   KOTOBA (Minna no Nihongo vocabulary)
   ===================================================================== */
const VW = [];
VOCAB.forEach(L => L.words.forEach((w, i) => {
  const k = !!(w.w && w.w !== w.r);
  const x = { id: "v" + L.n + "_" + i, n: L.n, w: w.w || w.r, r: w.r, k, uz: w.uz, ru: w.ru, rom: kanaToRomaji(w.r) };
  x.s = { r: fold(x.r), w: fold(x.w), rom: x.rom.toLowerCase(), romC: collapseLong(x.rom.toLowerCase()), uz: fold(x.uz), ru: fold(x.ru) };
  VW.push(x);
}));
const VMAP = new Map(VW.map(x => [x.id, x]));
const vMain = x => (S.kotoba.kanjiFirst && x.k) ? x.w : x.r;
const vSub = x => x.k ? (S.kotoba.kanjiFirst ? x.r : x.w) : "";
const vCls = s => s.length > 10 ? "xs" : s.length > 7 ? "s" : s.length > 4 ? "m" : "";
const vWords = () => S.kotoba.lesson === "all" ? VW : VW.filter(x => x.n === +S.kotoba.lesson);

function vMatch(x, q, qC) {
  const s = x.s; let best = 0;
  const chk = (f, v, w) => { if (!f) return; if (f === v) best = Math.max(best, w + 2); else if (f.startsWith(v)) best = Math.max(best, w + 1); else if (f.includes(v)) best = Math.max(best, w); };
  chk(s.r, q, 6); chk(s.w, q, 6); chk(s.rom, q, 5); chk(s.romC, qC, 4); chk(s.uz, q, 3); chk(s.ru, q, 3);
  return best;
}
function wordDetail(x) {
  const m = openModal(`<button class="x" type="button" data-close aria-label="close">✕</button>
    <div class="det-w">${esc(x.w)}</div><div class="det-row"><span class="under">${x.k ? esc(x.r) : ""}</span> ${spk(sayOf(x.r), true)}</div>
    <div class="rom" style="text-align:center">${esc(x.rom)}<small>${esc(cyrWord(x.rom))}</small></div>
    <div class="det-tr">${esc(tr(x))}</div><div class="note" style="text-align:center">${esc(lang === "uz" ? x.ru : x.uz)}</div>
    <p style="text-align:center;margin-top:12px"><span class="pill">${esc(t("lessonN", x.n))}</span></p>`);
  $("[data-close]", m).onclick = () => closeModal();
}

    let pool = vWords().filter(y => !bad(y));
    if (pool.length < 12) pool = pool.concat(VW.filter(y => !bad(y) && !pool.includes(y)));
    const seen = new Set(), d = [];
    shuffle(pool).forEach(y => { const key = dir === "fwd" ? y.uz + "|" + y.ru : y.r + "|" + y.w; if (d.length < 3 && !seen.has(key)) { seen.add(key); d.push(y); } });
    const all = [x, ...d], m = vMain(x), s = vSub(x);
    const exp = () => `<div class="fb-main jp">${esc(m)}${s ? ` <span style="font-size:.7em;opacity:.75">${esc(s)}</span>` : ""}</div><div class="fb-sub">${esc(x.rom)} · ${esc(tr(x))}</div>`;

      return {

        opts: all.map(y => ({ id: y.id, label: esc(tr(y)) })), explain: exp

      opts: all.map(y => { const a = vMain(y), b = vSub(y); return { id: y.id, label: `${esc(a)}${b ? ` <small>${esc(b)}</small>` : ""}` }; }),

/* =====================================================================
   KANJI (N5 / N4 / N3 / N2 — every kanji lives only in its easiest level)
   ===================================================================== */
const CAT_RU = {
  "1. RAQAMLAR": "1. ЧИСЛА", "2. VAQT VA KALENDAR": "2. ВРЕМЯ И КАЛЕНДАРЬ", "3. ODAMLAR VA OILA": "3. ЛЮДИ И СЕМЬЯ", "4. FE'LLAR": "4. ГЛАГОЛЫ",
  "5. JOYLAR VA TA'LIM": "5. МЕСТА И ОБРАЗОВАНИЕ", "6. TABIAT VA OB-HAVO": "6. ПРИРОДА И ПОГОДА", "7. SIFATLAR VA RANGLAR": "7. ПРИЛАГАТЕЛЬНЫЕ И ЦВЕТА",
  "8. ISH VA JAMIYAT": "8. РАБОТА И ОБЩЕСТВО", "9. KUNDALIK HAYOT": "9. БЫТ", "10. SAN'AT VA MADANIYAT": "10. ИСКУССТВО И КУЛЬТУРА"
};
const catLabel = c => (lang === "ru" ? (CAT_RU[c] || c) : c);
const KLV = { 5: [], 4: [], 3: [], 2: [] };
KANJI.forEach(k => KLV[k.lv].push(k));
Object.keys(KLV).forEach(l => KLV[l].sort((a, b) => a.idx - b.idx));
const KMAP = new Map(KANJI.map(k => [k.idx, k]));
const kunOf = k => (k.kun && k.kun !== "-") ? k.kun : "";
const readTxt = k => { const kn = kunOf(k); return kn ? k.on + " / " + kn : k.on; };
const readToks = k => {
  const norm = x => x.replace(/\(.*?\)/g, "").replace(/^-+|-+$/g, "");
  return [...k.on.split(/[・、,\s\/]+/), ...kunOf(k).split(/[・、,\s\/]+/)].map(norm).filter(Boolean);
};
const kanjiFlat = [];                                         // search index
KANJI.forEach(k => {
  const toks = [];
  [k.on, kunOf(k)].forEach(s => s.split(/[・、,\s\/]+/).forEach(x => {
    x = x.replace(/^-+|-+$/g, ""); if (!x) return;
    toks.push(fold(x.replace(/[()（）]/g, ""))); const b = fold(x.replace(/\(.*?\)/g, "")); if (b) toks.push(b);
  }));
  const u = Array.from(new Set(toks));
  k.s = {
    toks: u, rom: u.map(x => kanaToRomaji(x)), uz: fold(k.uz), ru: fold(k.ru),
    comp: k.comp.map(c => ({ w: fold(c.w), r: fold(c.r), rom: kanaToRomaji(fold(c.r)), uz: fold(c.uz), ru: fold(c.ru) }))
  };
  kanjiFlat.push(k);
});
function kMatch(k, q, qC) {
  const s = k.s; let best = 0, via = null;
  const up = (sc, v) => { if (sc > best) { best = sc; via = v || null; } };
  if (k.k === q) up(20); else if (q.includes(k.k)) up(9);
  s.toks.forEach(x => { if (x === q) up(12); else if (x.startsWith(q)) up(8); });
  s.rom.forEach(x => { if (x === q || collapseLong(x) === qC) up(11); else if (x.startsWith(q)) up(7); });
  const tx = (f, w) => { if (!f) return; if (f === q) up(w + 3); else if (f.startsWith(q)) up(w + 1); else if (f.includes(q)) up(w); };
  tx(s.uz, 6); tx(s.ru, 6);
  k.comp.forEach((c, i) => {
    const o = s.comp[i], b = best;
    tx(o.w, 4); tx(o.r, 4); tx(o.rom, 4); tx(o.uz, 3); tx(o.ru, 3);
    if (best > b && via === null) via = i;
    else if (best > b) via = i;
  });
  return { score: best, via };
}
function kanjiDetail(k) {
  const words = k.comp.map(w => `<div class="kc-word"><span class="w">${esc(w.w).split(esc(k.k)).join(`<span class="hl">${esc(k.k)}</span>`)}</span><span class="rv"><span class="r">${esc(w.r)}</span><span class="tr">${esc(tr(w))}</span></span>${spk(sayOf(w.r), true)}</div>`).join("");

    const L = this.list(), b = this.body();
    if (!L.length) { b.innerHTML = `<div class="empty-msg">${esc(t("noCards"))}</div>`; return; }
    this.pos = clamp(this.pos, 0, L.length - 1);
    const k = L[this.pos];
    const words = k.comp.map(w => `<div class="kc-word"><span class="w">${esc(w.w).split(esc(k.k)).join(`<span class="hl">${esc(k.k)}</span>`)}</span><span class="rv"><span class="r">${esc(w.r)}</span><span class="tr">${esc(tr(w))}</span></span>${spk(sayOf(w.r), true)}</div>`).join("");
    b.innerHTML = `<div class="kc-top"><span><b>${this.pos + 1}</b> / ${L.length}</span><span>N${k.lv} · ${esc(catLabel(k.cat))}</span></div>
      <div class="kc-nav"><button class="btn ghost" id="kPrev" type="button">← ${esc(t("prev"))}</button><button class="btn ghost" id="kTog" type="button">${esc(this.open ? t("hide") : t("reveal"))}</button><button class="btn ghost" id="kNext" type="button">${esc(t("next"))} →</button></div>
      <div class="kcard ${this.open ? "open" : ""}" id="kcard">
        <div class="kc-head"><div class="kc-kanji">${esc(k.k)}</div><div class="kc-info"><div class="readings" style="justify-content:flex-start"><span class="on-r">On: ${esc(k.on)}</span>${kunOf(k) ? `<span class="kun-r">Kun: ${esc(kunOf(k))}</span>` : ""}</div><div class="kc-mean">${esc(tr(k))}</div>${k.st ? `<div class="strokes">✎ ${esc(t("strokes", k.st))}</div>` : ""}</div></div>
        <div class="kc-wt">${esc(t("kcWords"))}</div>${words}
        <div class="tap" style="text-align:center">${esc(this.open ? t("tapHide") : t("tapShow"))}</div></div>
      <div class="row"><button class="btn ghost sm ${S.kanji.shuffle ? "on" : ""}" id="kShuf" type="button">🔀 ${esc(t("shuffle"))}</button></div>`;
    const go = d => { this.pos = (this.pos + d + L.length) % L.length; this.open = false; this.browse(); };
    $("#kPrev", b).onclick = () => go(-1); $("#kNext", b).onclick = () => go(1);
    const tg = () => { this.open = !this.open; this.browse(); };
    $("#kTog", b).onclick = tg; $("#kcard", b).onclick = e => { if (!e.target.closest(".spk")) tg(); };
    $("#kShuf", b).onclick = () => { this.pos = Math.floor(Math.random() * L.length); this.open = false; this.browse(); };
  },

  test() {
    const K = S.kanji, b = this.body(), n = this.cardsOf(K.kind).length;
    b.innerHTML = `<div id="qSetup">${this.kindChips()}<div class="panel glass"><div class="lbl">${esc(t("askAbout"))}</div>${chipsHtml("kdir", [["mix", t("dirMix")], ["read", t("askRead")], ["mean", t("askMean")]], K.dir)}${K.dir === "mix" ? `<div class="lbl" style="margin-top:10px">${esc(t("mixOpt"))}</div>${chipsHtml("kmm", [["0", t("mixNo")], ["1", t("mixYes")]], K.mixMean ? "1" : "0")}` : ""}
      <div class="lbl" style="margin-top:10px">${esc(t("howMany"))}</div><div class="cntrow">${chipsHtml("kcount", [["10", "10"], ["20", "20"], ["30", "30"], ["0", t("all")]], String(K.count))}${cntBox(K.count, [["10", "10"], ["20", "20"], ["30", "30"], ["0", t("all")]])}</div>

      <button class="btn block" id="qGo" type="button" style="margin-top:14px" ${n < 4 ? "disabled" : ""}>${esc(t("startTest"))}</button></div></div><div id="qz"></div>`;
    bindChips(b, "kind", v => { K.kind = v; save(); this.test(); });
    bindChips(b, "kdir", v => { K.dir = v; save(); this.test(); });
    bindChips(b, "kmm", v => { K.mixMean = v === "1"; save(); this.test(); });
    bindChips(b, "kcount", v => { K.count = +v; save(); this.test(); });
    bindCnt(b, "kcount", n => { K.count = n; save(); });
    const qz = this.qz = new Quiz($("#qz", b), { src: "kanji", onSetup: () => this.test(), onRun: on => { $("#qSetup", b).hidden = on; }, makeQ: c => this.makeQ(c) });
    $("#qGo", b).onclick = () => { let p = shuffle(this.cardsOf(K.kind)); if (K.count) p = p.slice(0, K.count); qz.start(p); };
  },
  makeQ(c) {
    const K = S.kanji, dir = K.dir === "mix" ? (K.mixMean && Math.random() < .5 ? "mean" : "read") : K.dir;
    const pk = KLV[K.level];
    if (c.type === "kanji") {
      const k = c.k, pool = shuffle(KANJI.filter(x => x.idx !== k.idx));
      if (dir === "mean") {
        const seen = new Set([tr(k)]), d = [];
        pool.forEach(x => { const m = tr(x); if (d.length < 3 && !seen.has(m) && x.uz !== k.uz && x.ru !== k.ru) { seen.add(m); d.push(x); } });
        return {
          pts: 1, prompt: `<div class="qrd" style="font-size:78px;line-height:1.1">${esc(k.k)}</div><div class="qprompt">${esc(t("qMeaning"))}</div>`, correct: k.idx,
          opts: [k, ...d].map(x => ({ id: x.idx, label: esc(tr(x)) })),
          explain: () => `<div class="fb-main"><span class="jp">${esc(k.k)}</span> — ${esc(tr(k))}</div><div class="fb-sub">${esc(readTxt(k))}</div>`
        };
      }
      const mine = new Set(readToks(k)), seen = new Set([readTxt(k)]), d = [];
      pool.forEach(x => { const r = readTxt(x); if (d.length < 3 && !seen.has(r) && !readToks(x).some(z => mine.has(z))) { seen.add(r); d.push(x); } });
      return {
        pts: 2, prompt: `<div class="qrd" style="font-size:78px;line-height:1.1">${esc(k.k)}</div><div class="qprompt">${esc(t("qReading"))}</div>`, correct: k.idx, optCls: "jp",
        opts: [k, ...d].map(x => ({ id: x.idx, label: esc(readTxt(x)) })),
        explain: () => `<div class="fb-main"><span class="jp">${esc(k.k)}</span> — ${esc(readTxt(k))}</div><div class="fb-sub">${esc(tr(k))}</div>`
      };
    }
    const w = c.c, all = shuffle(KANJI.reduce((a, k) => a.concat(k.comp.map((x, i) => ({ x, id: k.idx + "_" + i }))), []).filter(o => o.x.w !== w.w && o.x.r !== w.r && o.x.uz !== w.uz && o.x.ru !== w.ru));
    const near = all.filter(o => pk.some(k => o.id.startsWith(k.idx + "_"))), pool = near.length >= 20 ? near : all;
    const ex = () => `<div class="fb-main jp">${esc(w.w)}</div><div class="fb-sub">${esc(w.r)} — ${esc(tr(w))}</div>${spk(sayOf(w.r), true)}`;
    if (dir === "mean") {
      const seen = new Set([tr(w)]), d = [];
      pool.forEach(o => { const m = tr(o.x); if (d.length < 3 && !seen.has(m)) { seen.add(m); d.push(o); } });
      return {
        pts: 1, prompt: `<div class="big-w ${w.w.length > 5 ? "s" : "m"}">${esc(w.w)}</div><div class="qprompt">${esc(t("qMeaning"))}</div>`, correct: "me",
        opts: [{ id: "me", label: esc(tr(w)) }, ...d.map((o, i) => ({ id: "d" + i, label: esc(tr(o.x)) }))], explain: ex
      };
    }
    const seen = new Set([w.r]), d = [];
    pool.forEach(o => { if (d.length < 3 && !seen.has(o.x.r)) { seen.add(o.x.r); d.push(o); } });
    return {
      pts: 2, prompt: `<div class="big-w ${w.w.length > 5 ? "s" : "m"}">${esc(w.w)}</div><div class="qprompt">${esc(t("qReading"))}</div>`, correct: "me", optCls: "jp",
      opts: [{ id: "me", label: esc(w.r) }, ...d.map((o, i) => ({ id: "d" + i, label: esc(o.x.r) }))], explain: ex
    };
  }
};

const Board = {
  token: 0,
  open() {
    const m = openModal(`${SAKURA_BTN}<div id="lbBody"></div>`);
    m.classList.add("wide");
    $("[data-close]", m).onclick = () => closeModal();
    this.load();
  },
  head(sub) { return `<div class="lb-head"><h2>🏆 ${esc(t("lbTitle"))}</h2><p>${esc(sub || t("lbSub"))}</p></div>`; },
  async load() {
    const body = $("#lbBody"); if (!body) return;
    const my = ++this.token;
    if (!Cloud.on) { body.innerHTML = this.head() + `<div class="empty-msg">${esc(t("lbNoCloud"))}</div>`; return; }
    body.innerHTML = this.head() + `<div class="empty-msg">${esc(t("lbLoading"))}</div>`;
    try {
      const d = await Cloud.leaderboard();
      if (my !== this.token || !$("#lbBody")) return;
      this.draw(d);
    } catch (e) {
      if (my !== this.token || !$("#lbBody")) return;
      body.innerHTML = this.head() + `<div class="empty-msg">${esc(t("lbErr"))}</div><button class="btn block" type="button" id="lbRetry">${esc(t("lbRetry"))}</button>`;
      $("#lbRetry", body).onclick = () => this.load();
    }
  },
  row(u, pos, me) {
    const sen = u.title === "sensei" || u.sen, ri = rankIdx(u.score, sen), r = RANKS[ri];
    return `<div class="lb-row ${pos <= 3 ? "p" + pos : ""} ${me ? "me" : ""}"><span class="lb-pos">${pos >= 1 && pos <= 3 ? medal(pos) : (pos || "–")}</span><span class="lb-av rk-${r.id}${AVMAP.has(u.avatar) ? " has" : ""}"${avStyle(u.avatar)}>${esc(avChar(u.avatar, u.score, sen))}</span>
      <span class="lb-nm"><b>${esc(u.username)}</b>${me ? `<em class="lb-you">${esc(t("youTag"))}</em>` : ""}<span class="lb-rk rk-${r.id}"><i>${r.jp[0]}</i>${esc(rankName(ri))}</span></span>
      <span class="lb-sc"><b>${scTxt(u.score, sen)}</b> ${esc(t("ptsU"))}<span>🔥 ${u.streak} ${esc(t("daysU"))}</span></span></div>`;
  },
  draw(d) {
    const body = $("#lbBody"), mine = S.profile ? S.profile.name.toLowerCase() : "";
    const me = { username: S.profile ? S.profile.name : "", score: S.score, streak: liveStreak(), avatar: S.avatar, sen: S.sen };
    const idx = d.rows.findIndex(u => u.username.toLowerCase() === mine);
    const ri = rankIdx(S.score, S.sen);
    let h = this.head() + `<div class="lb-me glass"><span><i>🎯</i>${esc(t("yourPlace"))} <b>${d.rank ? "#" + d.rank : "–"}</b></span><span><i>⭐</i><b>${scTxt(S.score, S.sen)}</b> ${esc(t("ptsU"))}</span><span><i class="jp">${RANKS[ri].jp[0]}</i>${esc(rankName(ri))}</span></div>`;
    if (!d.rows.length) h += `<div class="empty-msg">${esc(t("lbEmpty"))}</div>`;
    else h += `<div class="lb-list">` + d.rows.map((u, k) => this.row(k === idx ? Object.assign({}, u, { score: me.score, streak: me.streak, avatar: me.avatar, sen: me.sen }) : u, k + 1, k === idx)).join("") +
      (idx < 0 && me.username ? `<div class="lb-gap">⋯</div>` + this.row(me, d.rank || 0, true) : "") + `</div>`;
    body.innerHTML = h;
  }
};

/* =====================================================================
   MISTAKES BOOK (Xatolar daftari): wrong test answers pile up here,
   a correct answer while reviewing removes them. Stored on this device.
   ===================================================================== */
const Mist = {
  all() { return Array.isArray(S.mist) ? S.mist : (S.mist = []); },
  has(s, id) { return this.all().some(e => e.s === s && e.id === id); },
  rec(src, it, ok) {
    if (ok || !it || it.id == null) return;
    const id = String(it.id);
    if (!this.has(src, id)) { this.all().push({ s: src, id, t: Date.now() }); if (S.mist.length > 600) S.mist.shift(); save(); this.badge(); }
  },
  remove(s, id) { S.mist = this.all().filter(e => !(e.s === s && e.id === id)); save(); this.badge(); },
  find(s, id) {
    if (s === "kana") {
      const [kd, gid, ch] = id.split(":"), g = KGROUPS.find(x => x.id === gid); if (!g) return null;
      for (const e of g.cells) { if (!e) continue; const c = kd === "h" ? e.h : e.k; if (c === ch) return { id, ch, kind: kd, r: e.r, c: e.c, alt: kd === "h" ? e.k : e.h, grp: gid }; }
      return null;
    }
    if (s === "read") return RD.find(x => x.id === id) || null;
    if (s === "kotoba") return VW.find(x => String(x.id) === id) || null;
    if (s === "kanji") {
      const p = id.split("_"), k = KANJI.find(x => String(x.idx) === p[1]); if (!k) return null;
      if (p[0] === "k") return { id, type: "kanji", g: k.idx, k };
      const c = k.comp[+p[2]]; return c ? { id, type: "word", g: k.idx, k, c } : null;
    }
    return null;
  },
  valid() { return this.all().map(e => { const it = this.find(e.s, e.id); return it ? { s: e.s, id: e.id, it } : null; }).filter(Boolean); },
  label(w) {
    const it = w.it;
    if (w.s === "kana") return [it.ch, it.r + " · " + it.c];
    if (w.s === "read") return [it.t, tr(it)];
    if (w.s === "kotoba") return [it.k ? it.w : it.r, (it.k ? it.r + " — " : "") + tr(it)];
    return it.type === "kanji" ? [it.k.k, tr(it.k) + " · " + readTxt(it.k)] : [it.c.w, it.c.r + " — " + tr(it.c)];
  },
  srcName(s) { return t(s === "kotoba" ? "pgKotoba" : s === "kanji" ? "pgKanji" : "pgKana"); },
  makeQ(w) { return w.s === "kana" ? Kana.makeQ(w.it) : w.s === "read" ? Kana.readQ(w.it) : w.s === "kotoba" ? Kotoba.makeQ(w.it) : Kanji.makeQ(w.it); },
  badge() {
    const b = $("#mistBtn"); if (!b) return;
    const n = this.all().length;
    b.innerHTML = `<span aria-hidden="true">📓</span>${n ? `<i class="bdg">${n > 99 ? "99+" : n}</i>` : ""}`;
    b.title = t("mistTitle"); b.setAttribute("aria-label", t("mistTitle") + (n ? ": " + n : ""));
  },
  open() {
    const m = openModal(`${SAKURA_BTN}<div id="mistBody"></div>`); m.classList.add("wide");
    $("[data-close]", m).onclick = () => closeModal();
    this.draw();
  },
  draw() {
    const body = $("#mistBody"); if (!body) return;
    const L = this.valid();
    const head = `<div class="lb-head"><h2>📓 ${esc(t("mistTitle"))}</h2><p>${esc(t("mistSub"))}</p></div>`;
    if (!L.length) { body.innerHTML = head + `<div class="empty-msg">${esc(t("mistEmpty"))}</div>`; return; }
    body.innerHTML = head + `<div class="mist-list">` + L.map((w, i) => { const [a, b] = this.label(w); return `<div class="mist-row"><span class="mw jp">${esc(a)}</span><span class="mt"><b>${esc(b)}</b><small>${esc(this.srcName(w.s))}</small></span><button class="mx" type="button" data-i="${i}" aria-label="${esc(t("mistDel"))}" title="${esc(t("mistDel"))}">✕</button></div>`; }).join("") +
      `</div><div class="col"><button class="btn" type="button" id="mGo">${esc(t("mistGo", L.length))}</button><button class="btn ghost" type="button" id="mClr">${esc(t("mistClear"))}</button></div>`;
    $$(".mx", body).forEach(b => b.onclick = () => { const w = L[+b.dataset.i]; this.remove(w.s, w.id); this.draw(); });
    $("#mGo", body).onclick = () => this.review(L);
    $("#mClr", body).onclick = () => { if (confirm(t("mistConfirm"))) { S.mist = []; save(); this.badge(); this.draw(); } };
  },
  review(L) {
    const body = $("#mistBody"); body.innerHTML = `<div id="mqz"></div>`;
    const qz = new Quiz($("#mqz", body), {
      onSetup: () => this.draw(), onRun: () => {}, makeQ: w => this.makeQ(w),
      onAnswer: (w, ok) => { if (ok) this.remove(w.s, w.id); }
    });
    qz.start(L);
  }
};

/* =====================================================================
   DAILY GOAL + STATISTICS
   S.goal = cards per day (0 = off) | S.act[day] = cards done that day | S.stat[src] = {a,c} test answers
   A "step" = a CORRECT quiz answer (each card counts once per day). Just viewing cards counts nothing.
   ===================================================================== */
const SRCS = ["kana", "read", "kotoba", "kanji"];
const Act = {
  today() { return (S.act && S.act[dayStr()]) || 0; },
  tick(n) {
    if (!S.act) S.act = {};
    const d = dayStr(), before = S.act[d] || 0;
    S.act[d] = before + (n || 1);
    const keys = Object.keys(S.act).sort(); while (keys.length > 60) delete S.act[keys.shift()];
    save();
    if (S.goal > 0 && before < S.goal && S.act[d] >= S.goal) setTimeout(() => { confetti(); toast(t("goalDone", S.goal)); }, 350);
    this.bar();
  },
  card(deck, id) {                              // each card counts once per day
    const d = dayStr(), k = deck + ":" + id;
    if (!S.actIds || S.actIds.d !== d) S.actIds = { d, k: {} };
    if (S.actIds.k[k]) return;
    S.actIds.k[k] = 1; this.tick(1);
  },
  ans(src, ok) {
    if (!S.stat) S.stat = {};
    const s = S.stat[src] || (S.stat[src] = { a: 0, c: 0 });
    s.a++; if (ok) s.c++; save();
  },
  setGoal(n) { S.goal = Math.max(0, Math.min(500, n | 0)); save(); this.bar(); },
  bar() {
    const el = $("#goalBar"); if (!el) return;
    const g = S.goal | 0, n = this.today();
    el.hidden = g <= 0;
    if (g <= 0) return;
    const pct = Math.min(100, Math.round(n / g * 100));
    $("i", el).style.width = pct + "%";
    el.classList.toggle("done", n >= g);
    $("span", el).textContent = (n >= g ? "✓ " : "") + t("goalToday", Math.min(n, 999), g);
    el.setAttribute("aria-label", t("goalToday", n, g));
  },
  seenOf(deck, total) { const d = S.srs[deck] || {}; return Math.min(total, Object.keys(d).filter(k => d[k] && d[k].r > 0).length); },
  totals() {
    let kana = 0; KGROUPS.forEach(g => g.cells.forEach(e => { if (!e) return; if (e.h) kana++; if (e.k) kana++; }));
    const kanji = KANJI.reduce((a, k) => a + 1 + k.comp.length, 0);
    return { kana, read: RD.length, kotoba: VW.length, kanji };
  },
  stats() {
    const T = this.totals(), g = S.goal | 0, today = this.today();
    const names = { kana: t("pgKana"), read: t("statRead"), kotoba: t("pgKotoba"), kanji: t("pgKanji") };
    const rows = SRCS.map(s => {
      const seen = this.seenOf(s, T[s]), st = (S.stat && S.stat[s]) || { a: 0, c: 0 }, pct = T[s] ? Math.round(seen / T[s] * 100) : 0;
      return `<div class="st-row"><div class="st-top"><b>${esc(names[s])}</b><span>${seen} / ${T[s]}</span></div><div class="bar"><i style="width:${pct}%"></i></div>
        <div class="st-sub">${esc(t("statAcc"))}: <b>${st.a ? Math.round(st.c / st.a * 100) + "%" : "–"}</b> <small>${st.a ? "(" + st.c + "/" + st.a + ")" : ""}</small></div></div>`;
    }).join("");
    const wk = lang === "ru" ? ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"] : ["Ya", "Du", "Se", "Ch", "Pa", "Ju", "Sh"];
    const days = []; for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push({ n: (S.act && S.act[dayStr(d)]) || 0, w: wk[d.getDay()], now: i === 0 }); }
    const mx = Math.max(g, 1, ...days.map(d => d.n));
    const chart = days.map(d => `<div class="wk${d.now ? " now" : ""}"><span class="wn">${d.n || ""}</span><div class="wb"><i style="height:${Math.round(d.n / mx * 100)}%"></i></div><span class="wd">${d.w}</span></div>`).join("");
    const r = RANKS[rankIdx(S.score, S.sen)];
    const m = openModal(`${SAKURA_BTN}<div class="lb-head"><h2>📊 ${esc(t("statTitle"))}</h2><p>${esc(t("statSub"))}</p></div>
      <div class="lb-me glass"><span><i>⭐</i><b>${scTxt(S.score, S.sen)}</b> ${esc(t("ptsU"))}</span><span><i>🔥</i><b>${liveStreak()}</b> ${esc(t("daysU"))}</span><span><i class="jp">${r.jp[0]}</i>${esc(rankName(rankIdx(S.score, S.sen)))}</span></div>
      <div class="lbl">${esc(t("statWeek"))}${g > 0 ? ` · ${esc(t("goalToday", today, g))}` : ""}</div><div class="wkchart">${chart}</div>
      <div class="lbl" style="margin-top:14px">${esc(t("statProg"))}</div>${rows}`);
    m.classList.add("wide");
    $("[data-close]", m).onclick = () => closeModal();
  }
};

/* =====================================================================
   BATCH TEST: after the learner has opened N cards, a test of exactly those cards starts.
   Too many mistakes (15% of the batch, min 2) -> look at the missed cards, then retest ALL of them
   (retest changes no points / goal). Still too many -> back to the cards.
   S.bn = N (0 = automatic test off) | S.bseen[deck] = ids opened since the last batch test
   ===================================================================== */
const Batch = {
  n() { return S.bn | 0; },
  ids(deck) { return (S.bseen && S.bseen[deck]) || []; },
  count(deck) { return this.ids(deck).length; },
  add(deck, id) {
    if (!S.bseen) S.bseen = {};
    const a = S.bseen[deck] || (S.bseen[deck] = []);
    id = String(id); if (!a.includes(id)) { a.push(id); if (a.length > 300) a.shift(); save(); }
  },
  clear(deck) { if (S.bseen) S.bseen[deck] = []; save(); },
  ready(deck) { return this.n() > 0 && this.count(deck) >= this.n(); },
  limit(total) { return Math.max(2, Math.ceil(total * 0.15)); },
  items(deck) { return this.ids(deck).map(id => { const it = Mist.find(deck, id); return it ? { s: deck, id, it } : null; }).filter(Boolean); },
  list(arr) { return `<div class="mist-list" style="max-height:30vh">${arr.map(w => { const [a, b] = Mist.label(w); return `<div class="mist-row"><span class="mw jp">${esc(a)}</span><span class="mt"><b>${esc(b)}</b></span></div>`; }).join("")}</div>`; },
  run(deck) {
    const L = this.items(deck);
    if (L.length < 4) { toast(t("batchNeed")); return; }
    const m = openModal(`${SAKURA_BTN}<div class="lb-head"><h2>📝 ${esc(t("batchTitle"))}</h2></div><div id="bBody"></div>`); m.classList.add("wide");
    $("[data-close]", m).onclick = () => closeModal();
    const body = $("#bBody", m), lim = this.limit(L.length);
    const finish = () => { this.clear(deck); };
    const screen = (em, title, text, extra, btn, fn) => {
      body.innerHTML = `<div class="done glass"><div class="em">${em}</div><h2>${esc(title)}</h2><p style="margin:0">${text}</p>${extra || ""}<div class="col"><button class="btn" type="button" id="bGo">${esc(btn)}</button></div></div>`;
      $("#bGo", body).onclick = fn;
    };
    const quiz = (retest, onEnd) => {
      body.innerHTML = `<div id="bq"></div>`;
      const qz = new Quiz($("#bq", body), {
        src: retest ? null : deck, noPts: retest, onSetup: () => closeModal(), onRun: () => {},
        makeQ: w => Mist.makeQ(w),
        onAnswer: (w, ok) => { if (retest && ok) Mist.remove(w.s, w.id); },
        onFinish: q => onEnd(q)
      });
      qz.start(L);
    };
    const review = wrong => {
      let i = 0;
      const show = () => {
        const w = wrong[i], [a, b] = Mist.label(w), last = i + 1 >= wrong.length;
        body.innerHTML = `<div class="qtop"><span><b>${i + 1}</b> / ${wrong.length}</span></div><div class="qcard"><div class="big-w m jp">${esc(a)}</div><div class="fb-sub" style="margin-top:10px;font-size:16px">${esc(b)}</div></div><button class="btn block" type="button" id="bNx">${esc(last ? t("batchRetest") : t("next"))}</button>`;
        $("#bNx", body).onclick = () => { if (last) quiz(true, end2); else { i++; show(); } };
      };
      show();
    };
    const end2 = q => {                                    // result of the retest
      finish();
      if (q.wrong.length >= lim) screen("💪", t("batchStopT"), esc(t("batchStop")), this.list(q.wrong), t("batchBack"), () => closeModal());
      else screen("🎉", t("batchOkT"), esc(t("resultText", q.ok, L.length).replace(/<[^>]+>/g, "")), q.wrong.length ? this.list(q.wrong) : "", t("batchBack"), () => closeModal());
    };
    const end1 = q => {                                    // result of the first round
      const wrong = q.wrong.slice();
      if (wrong.length >= lim) {
        screen("📖", t("batchManyT", wrong.length), esc(t("batchMany")), this.list(wrong), t("batchLook"), () => review(wrong));
      } else {
        finish();
        screen(wrong.length ? "👍" : "🏆", t("batchOkT"), esc(t("resultText", q.ok, L.length).replace(/<[^>]+>/g, "")) + `<br>${esc(t("earnedPts", q.earned))}`, wrong.length ? this.list(wrong) : "", t("batchBack"), () => closeModal());
      }
    };
    quiz(false, end1);
  }
};
