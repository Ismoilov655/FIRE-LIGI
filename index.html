  { m: "goal", uz: ["Kunlik maqsad", "Tepadagi chiziq — bugun nechta karta uchun to'g'ri javob berdingiz. Bossangiz statistika ochiladi. Maqsadni profilda o'zgartirasiz."], ru: ["Цель дня", "Полоса сверху показывает, на сколько карточек вы сегодня ответили верно. Нажмите — откроется статистика. Цель меняется в профиле."] },
  { m: "streak", uz: ["Streak 🔥", "Saytga har kun kirsangiz, streak ko'payadi. Bir kun o'tkazib yuborsangiz, yana 1 dan boshlanadi."], ru: ["Серия 🔥", "Заходите на сайт каждый день — серия растёт. Пропустите день — начнётся с 1."] },
  { m: "lb", tour: 1, uz: ["Reyting 🏆", "Ball yig'ib reytingda ko'tariling. Birinchi uch o'rin medal oladi."], ru: ["Рейтинг 🏆", "Набирайте очки и поднимайтесь в рейтинге. Первые три места получают медали."] },
  { m: "rank", uz: ["Unvonlar", "Ball ko'paygan sari unvon o'sadi: Ronin (0), Samuray (500), Shogun (1500)."], ru: ["Звания", "С ростом очков растёт звание: Ронин (0), Самурай (500), Сёгун (1500)."] },
  { m: "prof", uz: ["Profil", "Profil tugmasini bosing: o'z kanjingizni karuseldan tanlang, yorug' yoki qorong'i mavzuni belgilang, ismni o'zgartiring."], ru: ["Профиль", "Нажмите на профиль: выберите свой кандзи в карусели, светлую или тёмную тему, смените имя."] },
  { m: "search", uz: ["Qidiruv", "Kotoba va Kanji sahifalarida tepada qidiruv bor: yaponcha, lotincha, o'zbekcha yoki ruscha yozing."], ru: ["Поиск", "На страницах Котоба и Кандзи сверху есть поиск: пишите по-японски, латиницей, по-узбекски или по-русски."] }
];
const gtx = (g, i) => g[lang === "ru" ? "ru" : "uz"][i];
const Guide = {
  open() {
    const m = openModal(`${SAKURA_BTN}<div class="lb-head"><h2>❓ ${esc(t("guideTitle"))}</h2><p>${esc(t("guideSub"))}</p></div><div class="guide-list">${GUIDE.map(g => `<div class="gd glass"><div class="gd-pic">${GM[g.m]()}</div><div class="gd-tx"><b>${esc(gtx(g, 0))}</b><p>${esc(gtx(g, 1))}</p></div></div>`).join("")}</div>${Cloud.on ? `<a class="btn ghost block" style="margin-top:12px" href="${esc(helpUrl())}" target="_blank" rel="noopener">✉️ ${esc(t("helpBtn"))}</a>` : ""}`);
    m.classList.add("wide"); $("[data-close]", m).onclick = () => closeModal();
  }
};
const Tour = {
  maybe() { if (!S.tour) setTimeout(() => this.start(), 500); },
  done() { S.tour = 1; save(); },
  start() {
    const L = GUIDE.filter(g => g.tour); let i = 0;
    const draw = () => {
      const g = L[i], last = i === L.length - 1;
      const body = $("#tourBody"); if (!body) return;
      body.innerHTML = `<div class="tour-pic">${GM[g.m]()}</div><h2>${esc(gtx(g, 0))}</h2><p>${esc(gtx(g, 1))}</p>
        <div class="av-dots">${L.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>
        <button class="btn block" type="button" id="tNext">${esc(last ? t("tourStart") : t("next"))}</button>
        ${last ? `<div class="note" style="margin-top:10px;text-align:center">${esc(t("tourHelp"))}</div>` : `<button class="btn ghost block" type="button" id="tSkip" style="margin-top:8px">${esc(t("tourSkip"))}</button>`}`;
      $("#tNext", body).onclick = () => { if (last) { Tour.done(); closeModal(true); } else { i++; draw(); } };
      const sk = $("#tSkip", body); if (sk) sk.onclick = () => { Tour.done(); closeModal(true); };
    };
    openModal(`<div id="tourBody" style="text-align:center"></div>`, { lock: true });
    draw();
  }
};

/* =====================================================================
   ACCOUNT: name + password (Supabase email auth with a hidden address built from the name)
   ===================================================================== */
const CONTACT = "ismoilov_mzohid";
const helpUrl = () => "https://t.me/" + CONTACT + "?text=" + encodeURIComponent(t("helpMsg", S.profile ? S.profile.name : ""));
const PW_MIN = 6;

Object.assign(Cloud, {
  emailOf(name) { return "n" + Array.from(name.toLowerCase()).map(c => c.charCodeAt(0).toString(16).padStart(2, "0")).join("") + "@fireligi.app"; },
  async setPw(name, pw, firstTime) {          // anonymous device account -> name+password account (or just a new password)
    try {
      const s = await this.session();
      const body = firstTime ? { email: this.emailOf(name), password: pw } : { password: pw };
      const r = await this.raw("/auth/v1/user", { method: "PUT", token: s.access_token, body });
      if (r.ok) return { ok: true };
      const msg = JSON.stringify(r.data || {});
      if (/weak|short|at least|characters/i.test(msg)) return { weak: true };
      if (/already|exists|registered/i.test(msg)) return { exists: true };
      return { error: true };
    } catch (e) { return { error: true }; }
  },
  async login(name, pw) {
    try {
      const a = await this.raw("/rest/v1/rpc/login_email", { method: "POST", body: { n: name } });
      if (!a.ok) return { error: true };
      if (!a.data) return { bad: true };
      const r = await this.raw("/auth/v1/token?grant_type=password", { method: "POST", body: { email: a.data, password: pw } });
      if (!r.ok || !r.data || !r.data.access_token) return r.status === 400 ? { bad: true } : { error: true };
      this.setSess(r.data);
      const p = await this.raw("/rest/v1/profiles?id=eq." + encodeURIComponent(this.sess.uid) + "&select=username,score,streak,avatar,last_day,title", { token: r.data.access_token });
      if (!p.ok || !Array.isArray(p.data) || !p.data.length) return { error: true };
      return { ok: true, row: p.data[0] };
    } catch (e) { return { error: true }; }
  }
});

function pwField(id, ph, auto) {
  return `<div class="pw-wrap"><input class="field" id="${id}" type="password" maxlength="40" autocomplete="${auto}" autocapitalize="off" spellcheck="false" placeholder="${esc(ph)}"><button class="pw-eye" type="button" data-eye="${id}" aria-label="${esc(t("pwShow"))}">👁</button></div>`;
}
function bindEyes(m) {
  $$("[data-eye]", m).forEach(b => b.onclick = () => { const i = $("#" + b.dataset.eye, m); i.type = i.type === "password" ? "text" : "password"; });
}

function welcome(mode) {
  const reg = mode !== "login", needPw = Cloud.on;
  let timer = null, nameOk = false;
  const m = openModal(`<h2>${esc(t(reg ? "welcome" : "loginTitle"))}</h2>
    <p>${esc(t(reg ? "nameIntro" : "loginIntro"))}</p>
    <input class="field" id="nameIn" maxlength="16" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="${esc(t("namePh"))}">
    <div class="msg wait" id="nameMsg">${esc(t(reg ? "nameRule" : "loginRule"))}</div>
    ${needPw ? pwField("pwIn", t("pwPh"), reg ? "new-password" : "current-password") + `<div class="note pw-note">${esc(t(reg ? "pwWhy" : "pwLoginHint"))}</div>` : ""}
    <button class="btn block" id="nameGo" type="button" disabled>${esc(t(reg ? "start" : "loginBtn"))}</button>
    ${needPw ? `<button class="btn ghost block" id="swMode" type="button" style="margin-top:8px">${esc(t(reg ? "haveAcc" : "newAcc"))}</button>
    <a class="help-link" id="helpLnk" href="${esc(helpUrl())}" target="_blank" rel="noopener">${esc(t("helpLink"))}</a>` : `<div class="note" style="margin-top:12px">${esc(t("localOnly"))}</div>`}`, { lock: true });
  const inp = $("#nameIn", m), msg = $("#nameMsg", m), go = $("#nameGo", m), pwIn = $("#pwIn", m);
  bindEyes(m);
  const setMsg = (c, s) => { msg.className = "msg " + c; msg.textContent = s; };
  const pwOk = () => !needPw || (reg ? pwIn.value.length >= PW_MIN : pwIn.value.length > 0);
  const refresh = () => { go.disabled = !(nameOk && pwOk()); };
  const check = async () => {
    const v = inp.value.trim(); nameOk = false; refresh();
    if (!v) { setMsg("wait", t(reg ? "nameRule" : "loginRule")); return; }
    if (!NAME_RE.test(v)) { setMsg("no", t("nameBad")); return; }
    if (!reg || !Cloud.on) { nameOk = true; setMsg("ok", reg ? t("nameOk") : ""); refresh(); return; }
    setMsg("wait", t("nameChecking"));
    try {
      const free = await Cloud.available(v);
      if (inp.value.trim() !== v) return;
      if (free) { nameOk = true; setMsg("ok", t("nameOk")); refresh(); } else setMsg("no", t("nameTaken", v));
    } catch (e) { if (inp.value.trim() === v) setMsg("no", t("nameNet")); }
  };
  inp.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(check, 350); });
  if (pwIn) pwIn.addEventListener("input", () => {
    refresh();
    if (reg && pwIn.value && pwIn.value.length < PW_MIN) setMsg("no", t("pwWeak")); else if (reg && nameOk) setMsg("ok", t("nameOk"));
  });
  const submit = () => { if (!go.disabled) go.click(); };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  if (pwIn) pwIn.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  const sw = $("#swMode", m); if (sw) sw.onclick = () => welcome(reg ? "login" : "reg");
  go.onclick = async () => {
    const v = inp.value.trim(), pw = pwIn ? pwIn.value : ""; go.disabled = true; setMsg("wait", t("nameChecking"));
    if (reg) {
      const res = await Cloud.claim(v);
      if (res.taken) { setMsg("no", t("nameTaken", v)); return; }
      if (!res.ok) { setMsg("no", t("nameNet")); go.disabled = false; return; }
      if (needPw) {
        const p = await Cloud.setPw(v, pw, true);
        if (!p.ok) { setMsg("no", t(p.weak ? "pwWeak" : p.exists ? "pwExists" : "pwFail")); go.disabled = false; return; }
      }
      S.profile = { name: v, since: dayStr() }; S.acct = needPw; S.pw = needPw ? pw : ""; save();
      closeModal(true); renderProfile(); toast(t("hello", v)); Tour.maybe();
    } else {
      const res = await Cloud.login(v, pw);
      if (res.bad) { setMsg("no", t("loginBad")); go.disabled = false; return; }
      if (!res.ok) { setMsg("no", t("nameNet")); go.disabled = false; return; }
      const r = res.row, same = S.profile && S.profile.name.toLowerCase() === String(r.username).toLowerCase();
      S.profile = { name: r.username, since: S.profile && same ? S.profile.since : dayStr() };
      S.score = same ? Math.max(S.score, r.score || 0) : (r.score || 0);
      S.streak = same ? Math.max(S.streak, r.streak || 0) : (r.streak || 0);
      S.lastDay = r.last_day && (!same || !S.lastDay || r.last_day > S.lastDay) ? r.last_day : (same ? S.lastDay : "");
      if (r.avatar) S.avatar = r.avatar;
      S.sen = r.title === "sensei"; S.acct = true; S.pw = pw; S.tour = 1; save();
      closeModal(true); renderProfile(); Act.bar(); Cloud.push(); toast(t("hello", r.username));
    }
  };
  setTimeout(() => inp.focus(), 40);
}

function pwModal() {                          // set a password (old account) or change it
  const first = !S.acct;
  const m = openModal(`${SAKURA_BTN}<h2>${esc(t(first ? "pwSet" : "pwChange"))}</h2>
    <p>${esc(t(first ? "pwSetWarn" : "pwChangeIntro"))}</p>
    ${pwField("pwNew", t("pwPh"), "new-password")}
    <div class="msg wait" id="pwMsg">${esc(t("pwWhy2"))}</div>
    <button class="btn block" id="pwSave" type="button" disabled>${esc(t("pwSaveBtn"))}</button>`);
  const inp = $("#pwNew", m), go = $("#pwSave", m), msg = $("#pwMsg", m);
  const setMsg = (c, s) => { msg.className = "msg " + c; msg.textContent = s; };
  bindEyes(m);
  $("[data-close]", m).onclick = () => { closeModal(); profileModal(); };
  inp.addEventListener("input", () => { go.disabled = inp.value.length < PW_MIN; if (inp.value && inp.value.length < PW_MIN) setMsg("no", t("pwWeak")); else setMsg("wait", t("pwWhy2")); });
  inp.addEventListener("keydown", e => { if (e.key === "Enter" && !go.disabled) go.click(); });
  go.onclick = async () => {
    go.disabled = true; setMsg("wait", t("nameChecking"));
    const p = await Cloud.setPw(S.profile.name, inp.value, first);
    if (!p.ok) { setMsg("no", t(p.weak ? "pwWeak" : p.exists ? "pwExists" : "pwFail")); go.disabled = false; return; }
    S.acct = true; S.pw = inp.value; save(); toast(t("pwSaved")); closeModal(); profileModal();
  };
}

function acctBlock() {
  if (!Cloud.on || !S.profile) return "";
  const help = `<a class="btn ghost" href="${esc(helpUrl())}" target="_blank" rel="noopener">✉️ ${esc(t("helpBtn"))}</a>`;
  const leave = `<button class="btn ghost" type="button" data-leave="out">↩ ${esc(t("outGo"))}</button><button class="btn ghost danger-t" type="button" data-leave="del">🗑 ${esc(t("delGo"))}</button>`;
  if (!S.acct) return `<div class="lbl" style="margin-top:14px">${esc(t("acctLbl"))}</div>
    <div class="warn">${esc(t("pwSetWarn"))}</div>
    <div class="col" style="margin-top:10px"><button class="btn" type="button" data-pwset>🔒 ${esc(t("pwSet"))}</button>${help}${leave}</div>`;
  return `<div class="lbl" style="margin-top:14px">${esc(t("acctLbl"))}</div>
    <div class="pf-row"><span>${esc(t("pwLbl"))}</span><b id="pwShown" data-on="0">${S.pw ? "••••••" : "–"}</b></div>
    ${S.pw ? "" : `<div class="note">${esc(t("pwNoLocal"))}</div>`}
    <div class="col" style="margin-top:8px">${S.pw ? `<button class="btn ghost" type="button" data-pwshow>👁 ${esc(t("pwShow"))}</button>` : ""}<button class="btn ghost" type="button" data-pwchg>🔑 ${esc(t("pwChange"))}</button>${help}${leave}</div>`;
}
function bindAcct(m) {
  const a = $("[data-pwset]", m), c = $("[data-pwchg]", m), s = $("[data-pwshow]", m);
  $$("[data-leave]", m).forEach(b => b.onclick = () => leaveModal(b.dataset.leave));
  if (a) a.onclick = () => pwModal();
  if (c) c.onclick = () => pwModal();
  if (s) s.onclick = () => { const b = $("#pwShown", m), on = b.dataset.on === "1"; b.dataset.on = on ? "0" : "1"; b.textContent = on ? "••••••" : S.pw; s.lastChild.textContent = " " + t(on ? "pwShow" : "pwHide"); };
}

/* sign out / delete account */
function wipeDevice() {                       // forget everything on this device and start from the welcome screen
  wiping = true;
  try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(OLD_KEY); localStorage.removeItem("kf_sb_sess"); } catch (e) {}
  location.reload();
}
function leaveModal(kind) {                   // kind: "out" | "del"
  const del = kind === "del";
  const warnOut = !S.acct && Cloud.on;
  const m = openModal(`${SAKURA_BTN}<h2>${esc(t(del ? "delTitle" : "outTitle"))}</h2>
    <p>${esc(t(del ? "delText" : "outText"))}</p>
    ${warnOut ? `<div class="warn">${esc(t("outNoPw"))}</div>` : ""}
    <div class="msg wait" id="lvMsg" style="min-height:0"></div>
    <div class="col"><button class="btn${del ? " danger" : ""}" id="lvGo" type="button">${esc(t(del ? "delGo" : "outGo"))}</button>
    <button class="btn ghost" type="button" data-close>${esc(t("cancel"))}</button></div>`);
  $$("[data-close]", m).forEach(b => b.onclick = () => { closeModal(); profileModal(); });
  $("#lvGo", m).onclick = async () => {
    const go = $("#lvGo", m); go.disabled = true;
    if (del && Cloud.on) {
      try {
        const s = await Cloud.session();
        const r = await Cloud.raw("/rest/v1/rpc/delete_my_account", { method: "POST", token: s.access_token, body: {} });
        if (!r.ok) { const mm = $("#lvMsg", m); mm.className = "msg no"; mm.textContent = t("nameNet"); go.disabled = false; return; }
      } catch (e) { const mm = $("#lvMsg", m); mm.className = "msg no"; mm.textContent = t("nameNet"); go.disabled = false; return; }
    }
    wipeDevice();
  };
}

/* =====================================================================
   APP SHELL
   ===================================================================== */
const PAGES = { kana: Kana, kotoba: Kotoba, kanji: Kanji };
const inited = {};
let curPage = "kana";

function applyTheme(th, persist) {
  document.documentElement.setAttribute("data-theme", th);
  const m = $("#metaTheme"); if (m) m.setAttribute("content", th === "dark" ? "#0B0818" : "#FBF1F4");
  if (persist) { S.theme = th; save(); }
  renderProfile();
}
function staticTexts() {
  document.documentElement.lang = lang;
  $("#pgKana").textContent = t("pgKana"); $("#pgKotoba").textContent = t("pgKotoba"); $("#pgKanji").textContent = t("pgKanji");
  $("#brandSub").textContent = t("brandSub");
  $("#pages").setAttribute("aria-label", t("pages"));
  document.title = t("title");
}
function showPage(p) {
  curPage = p;
  $$("main > section").forEach(s => s.hidden = s.id !== "pg-" + p);
  $$("#pages .pg-btn").forEach(b => { const on = b.dataset.pg === p; b.classList.toggle("on", on); b.setAttribute("aria-current", on ? "page" : "false"); });
  if (!inited[p]) { inited[p] = true; PAGES[p].init($("#pg-" + p)); }
  window.scrollTo({ top: 0 });
}
function setLang(l) {
  lang = l; S.lang = l; save(); staticTexts(); renderProfile(); Mist.badge(); Act.bar(); $("#guideBtn").title = $("#guideBtn").ariaLabel = t("guideTitle");
  Object.keys(inited).forEach(p => PAGES[p].render());
}

document.addEventListener("keydown", e => {
  if (modalOpen || e.ctrlKey || e.metaKey || e.altKey) return;
  const a = document.activeElement, tag = a && a.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  const vis = h => h && h.isConnected && !h.closest("[hidden]");
  const f = KB.flash, q = KB.quiz;
  if (q && q.phase !== "idle" && vis(q.host) && q.host.innerHTML) {
    if (q.phase === "run" && !q.answered && /^[1-4]$/.test(e.key)) { const o = q.q.opts[+e.key - 1]; if (o) { e.preventDefault(); q.answer(o.id); } }
    else if ((e.key === "Enter" || e.key === " " || e.key === "ArrowRight") && q.phase === "run" && q.answered) { e.preventDefault(); q.next(); }
    return;
  }
  if (f && vis(f.host) && f.list && f.list.length) {
    if (e.key === " " || e.key === "Enter") { if (tag === "BUTTON") return; e.preventDefault(); f.flip(); }
    else if (e.key === "ArrowRight") f.go(1);
    else if (e.key === "ArrowLeft") f.go(-1);
  }
});

function boot() {
  loadState();
  if (S.bnv !== 2) { S.bn = 0; S.bnv = 2; save(); }              // auto-test is OFF by default; players turn it on themselves
  lang = S.lang === "ru" ? "ru" : "uz";
  Cloud.loadSess();
  const th = S.theme === "dark" || S.theme === "light" ? S.theme : (document.documentElement.getAttribute("data-theme") || "light");
  document.documentElement.setAttribute("data-theme", th);
  $("#langSel").value = lang;
  staticTexts(); dailyVisit(); renderProfile(); applyTheme(th, false);
  $("#lbBtn").onclick = () => Board.open();
  $("#mistBtn").onclick = () => Mist.open(); Mist.badge();
  $("#goalBar").onclick = () => Act.stats(); Act.bar();
  $("#guideBtn").onclick = () => Guide.open();
  if (S.profile && !S.tour) { S.tour = 1; save(); }
  $("#langSel").onchange = e => setLang(e.target.value);
  $("#sealBtn").onclick = () => { if (S.profile) profileModal(); else askName(true); };
  $("#streakBtn").onclick = () => toast(t("streakTip", liveStreak()));
  $$("#pages .pg-btn").forEach(b => b.onclick = () => showPage(b.dataset.pg));
  showPage("kana");                                  // the app always opens on Kana -> chart
  if (!S.profile) askName(true); else Cloud.sync();
}
boot();
